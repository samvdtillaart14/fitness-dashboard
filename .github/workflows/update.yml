name: Garmin-data bijwerken

on:
  schedule:
    - cron: "17 * * * *" # elk uur (GitHub kan wat later starten)
  workflow_dispatch: # handmatig starten via de Actions-tab

permissions:
  contents: write # versleutelde data + tokens terugschrijven
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q garminconnect cryptography

      - name: Tokens en vorige data ontsleutelen
        run: |
          python crypt.py dec TOKEN_KEY secrets/garmin_tokens.enc ~/.garminconnect/garmin_tokens.json
          if [ -f site/data.enc ]; then python crypt.py dec DASH_PASSWORD site/data.enc site/data.json; fi

      - name: Garmin-data ophalen
        run: python fetch_garmin.py < /dev/null

      - name: Versleutelen en opslaan
        if: always() # vernieuwde tokens ook bewaren als ophalen half mislukt
        run: |
          python crypt.py enc TOKEN_KEY ~/.garminconnect/garmin_tokens.json secrets/garmin_tokens.enc
          if [ -f site/data.json ]; then python crypt.py enc DASH_PASSWORD site/data.json site/data.enc; fi
          rm -f site/data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.enc secrets/garmin_tokens.enc
          git commit -qm "Data bijwerken" && git push || echo "niets te committen"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
